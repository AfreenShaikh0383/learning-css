<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms And Inputs</title>
    <link rel="stylesheet" href="39-forms-and-inputs.css" />
  </head>
  <body>
    <h1>Forms and Inputs</h1>
    <p>Styling form controls and focus states</p>
    <main>
      <h1>Student Registration</h1>
      <form>
        <label>Name</label><input type="text" placeholder="Enter your name" />
        <label>Email</label
        ><input type="email" placeholder="Enter your email" />
        <label>Course</label
        ><select>
          <option>HTML</option>
          <option>CSS</option>
          <option>JavaScript</option>
        </select>
        <label>Message</label
        ><textarea rows="5" placeholder="Write a message"></textarea>
        <button type="submit">Register</button>
      </form>
    </main>
  </body>
</html>
